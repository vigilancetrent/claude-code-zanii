<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D77757"/>
      <stop offset="100%" stop-color="#E8956E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5769F7"/>
      <stop offset="100%" stop-color="#8B9BFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff06" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow blobs -->
  <circle cx="200" cy="300" r="200" fill="#D7775710" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="180" fill="#5769F710" filter="url(#glow)"/>

  <!-- Left content -->
  <text x="80" y="180" fill="#888" font-size="14" font-weight="500" letter-spacing="3">CLAUDE CODE ZANII</text>

  <text x="80" y="250" fill="#fff" font-size="72" font-weight="800" letter-spacing="-2">
    <tspan fill="url(#orange)">v2.9</tspan><tspan fill="#555">.0</tspan>
  </text>

  <text x="80" y="310" fill="#ccc" font-size="22" font-weight="400">Layered Memory System</text>
  <text x="80" y="342" fill="#888" font-size="16">24 bug fixes · 3647 lines added · 6031 tests passing</text>

  <!-- Feature pills -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#7C3AED15" stroke="#7C3AED55" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" fill="#9F67FF" font-size="11" font-weight="600">L1/L2/L3 Memory</text>

    <rect x="152" y="0" width="130" height="32" rx="16" fill="#D7775715" stroke="#D7775755" stroke-width="1"/>
    <text x="217" y="20" text-anchor="middle" fill="#E8956E" font-size="11" font-weight="600">CodeGraph</text>

    <rect x="294" y="0" width="130" height="32" rx="16" fill="#0891B215" stroke="#0891B255" stroke-width="1"/>
    <text x="359" y="20" text-anchor="middle" fill="#22D3EE" font-size="11" font-weight="600">Wiki Search</text>

    <rect x="436" y="0" width="130" height="32" rx="16" fill="#CA8A0415" stroke="#CA8A0455" stroke-width="1"/>
    <text x="501" y="20" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="600">Skill Lifecycle</text>

    <rect x="578" y="0" width="130" height="32" rx="16" fill="#05966915" stroke="#05966955" stroke-width="1"/>
    <text x="643" y="20" text-anchor="middle" fill="#34D399" font-size="11" font-weight="600">Team ACL</text>

    <rect x="720" y="0" width="140" height="32" rx="16" fill="#5769F715" stroke="#5769F755" stroke-width="1"/>
    <text x="790" y="20" text-anchor="middle" fill="#8B9BFF" font-size="11" font-weight="600">Zanii Proofs</text>
  </g>

  <!-- Right side: terminal mockup -->
  <rect x="720" y="120" width="420" height="380" rx="12" fill="#0d0d12" stroke="#333" stroke-width="1"/>
  <rect x="720" y="120" width="420" height="36" rx="12" fill="#16161e"/>
  <rect x="720" y="144" width="420" height="12" fill="#16161e"/>
  <circle cx="742" cy="138" r="5" fill="#ff5f57"/>
  <circle cx="758" cy="138" r="5" fill="#febc2e"/>
  <circle cx="774" cy="138" r="5" fill="#28c840"/>
  <text x="780" y="153" fill="#555" font-size="10">ccz — zanii-proof</text>

  <!-- Terminal content -->
  <text x="740" y="190" fill="#34D399" font-size="11" font-weight="600">$ ccz --version</text>
  <text x="740" y="210" fill="#ccc" font-size="11">claude-code-zanii 2.9.0</text>

  <text x="740" y="240" fill="#34D399" font-size="11" font-weight="600">$ ccz /memory-audit</text>
  <text x="740" y="260" fill="#ccc" font-size="11">  L3 persona:    12 entries (3.2 KB)</text>
  <text x="740" y="276" fill="#ccc" font-size="11">  L2 scenarios:  28 entries (8.1 KB)</text>
  <text x="740" y="292" fill="#ccc" font-size="11">  L1 atoms:     142 entries (22.4 KB)</text>
  <text x="740" y="308" fill="#D77757" font-size="11">  CodeGraph:   1291 files indexed</text>
  <text x="740" y="324" fill="#22D3EE" font-size="11">  Wiki:        47 docs, PageRank OK</text>

  <text x="740" y="354" fill="#34D399" font-size="11" font-weight="600">$ ccz /skill-promote list</text>
  <text x="740" y="374" fill="#ccc" font-size="11">  Found 3 skill(s):</text>
  <text x="740" y="390" fill="#ccc" font-size="11">  [project] debug-helper v0.2.0 (draft)</text>
  <text x="740" y="406" fill="#ccc" font-size="11">  [user]    test-writer  v1.3.0 (stable)</text>

  <text x="740" y="436" fill="#E8956E" font-size="11" font-weight="600">zanii ✓ proof verified · log #6156</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0a0a0f" stroke="#222" stroke-width="0.5"/>
  <text x="600" y="615" text-anchor="middle" fill="#555" font-size="11">
    npm install -g claude-code-zanii@2.9.0 · github.com/vigilancetrent/claude-code-zanii
  </text>
</svg>