<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7681"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- column titles -->
  <text x="60" y="30" fill="#8b949e" font-size="12" letter-spacing="2">YOUR MACHINE</text>
  <text x="400" y="30" fill="#8b949e" font-size="12" letter-spacing="2">ZANII LEDGER</text>
  <text x="720" y="30" fill="#8b949e" font-size="12" letter-spacing="2">ANYONE AUDITING</text>
  <line x1="360" y1="40" x2="360" y2="320" stroke="#21262d" stroke-dasharray="4 4"/>
  <line x1="668" y1="40" x2="668" y2="320" stroke="#21262d" stroke-dasharray="4 4"/>

  <!-- machine column -->
  <rect x="30" y="56" width="300" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="82" fill="#e6edf3" font-size="14" font-weight="600">Hardware identity</text>
  <text x="46" y="104" fill="#8b949e" font-size="12">SMBIOS UUID &#8594; sha256 &#8594; org name</text>

  <rect x="30" y="146" width="300" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="172" fill="#e6edf3" font-size="14" font-weight="600">Agent keys (Ed25519)</text>
  <text x="46" y="194" fill="#8b949e" font-size="12">did:key &#183; owner-signed delegation</text>

  <rect x="30" y="236" width="300" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="262" fill="#e6edf3" font-size="14" font-weight="600">Signed receipts, hash-chained</text>
  <text x="46" y="284" fill="#8b949e" font-size="12">only payload_hash leaves the machine</text>

  <!-- ledger column -->
  <rect x="396" y="96" width="236" height="128" rx="8" fill="#161b22" stroke="#d77757" stroke-width="1.3"/>
  <text x="412" y="124" fill="#e6edf3" font-size="14" font-weight="600">Append-only Merkle log</text>
  <text x="412" y="148" fill="#8b949e" font-size="12">ledger.zanii.agency</text>
  <!-- mini merkle tree -->
  <circle cx="452" cy="182" r="5" fill="#d77757"/>
  <circle cx="500" cy="182" r="5" fill="#d77757"/>
  <circle cx="548" cy="182" r="5" fill="#d77757"/>
  <circle cx="576" cy="182" r="5" fill="#d77757"/>
  <circle cx="476" cy="204" r="5" fill="#6e7681"/>
  <circle cx="524" cy="204" r="5" fill="#6e7681"/>
  <path d="M452 182 L476 204 M500 182 L476 204 M548 182 L524 204 M576 182 L524 204" stroke="#30363d" fill="none"/>
  <text x="412" y="240" fill="#8b949e" font-size="11">head anchored on-chain periodically</text>

  <!-- auditor column -->
  <rect x="704" y="96" width="186" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="720" y="122" fill="#e6edf3" font-size="13" font-weight="600">GET /v1/proof/{hash}</text>
  <text x="720" y="142" fill="#8b949e" font-size="12">public &#183; no key needed</text>

  <rect x="704" y="180" width="186" height="72" rx="8" fill="#12261e" stroke="#3fb950"/>
  <text x="720" y="208" fill="#3fb950" font-size="13" font-weight="600">Verified offline</text>
  <text x="720" y="228" fill="#8b949e" font-size="11.5">signature &#183; delegation &#183;</text>
  <text x="720" y="244" fill="#8b949e" font-size="11.5">scope &#183; Merkle inclusion</text>

  <!-- arrows -->
  <line x1="330" y1="88" x2="392" y2="130" stroke="#6e7681" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="338" y="98" fill="#58626e" font-size="11">signup + key</text>
  <line x1="330" y1="178" x2="392" y2="160" stroke="#6e7681" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="336" y="162" fill="#58626e" font-size="11">sign</text>
  <line x1="330" y1="268" x2="392" y2="196" stroke="#6e7681" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="330" y="252" fill="#58626e" font-size="11">batch POST /v1/receipts</text>

  <line x1="632" y1="140" x2="700" y2="126" stroke="#3fb950" stroke-width="1.2" marker-end="url(#arrg)"/>
  <line x1="797" y1="156" x2="797" y2="176" stroke="#3fb950" stroke-width="1.2" marker-end="url(#arrg)"/>
</svg>
